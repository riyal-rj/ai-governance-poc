[project]
name = "finassist"
version = "0.1.0"
description = "Governed FinAssist API foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "asyncpg>=0.31,<1",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.26,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "uvicorn[standard]>=0.52,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<6",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["src", "scripts"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=src --cov=scripts --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["src", "scripts"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "\\.\\.\\.$",
]
