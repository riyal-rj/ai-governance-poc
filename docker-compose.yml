name: finassist

services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      FINASSIST_DATABASE__DSN: postgresql://finassist:${POSTGRES_PASSWORD:-finassist_local_only}@postgres:5432/finassist
      FINASSIST_OPA__BASE_URL: http://opa:8181
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: finassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finassist_local_only}
      POSTGRES_DB: finassist
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finassist -d finassist"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.19.1-static
    command: ["run", "--server", "--addr=0.0.0.0:8181"]
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test:
        - CMD
        - /opa
        - eval
        - --fail
        - http.send({"method":"get","url":"http://127.0.0.1:8181/health"}).status_code == 200
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    read_only: true
    restart: unless-stopped

volumes:
  postgres-data:
